name: Scanner Android build

on:
  push:
    paths:
      - "scanner-android/**"
      - ".github/workflows/scanner-android.yml"
  pull_request:
    paths:
      - "scanner-android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: rskusum-scanner-apks
          path: |
            scanner-android/app/build/outputs/apk/debug/*.apk
            scanner-android/app/build/outputs/apk/release/*.apk

      - name: Publish APK as a downloadable release
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RSKusumScanner-debug.apk
          cp app/build/outputs/apk/release/app-release.apk RSKusumScanner-release.apk
          gh release delete scanner-latest --yes --cleanup-tag || true
          gh release create scanner-latest RSKusumScanner-release.apk RSKusumScanner-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "RS Kusum Scanner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install RSKusumScanner-release.apk on your phone."
        env:
          GH_TOKEN: ${{ github.token }}
