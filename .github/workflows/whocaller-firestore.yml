name: WhoCaller Firestore

# Recomputes callerNumbers (spam score, report counts, categories) from user reports.
# Needed on the free Spark plan, where the onReportWritten Cloud Function can't be deployed.
# Requires the repository secret FIREBASE_SERVICE_ACCOUNT (service-account JSON); skips without it.
on:
  schedule:
    - cron: "17 21 * * *" # every night, 02:47 IST
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [aggregate, seed-sample]
        default: aggregate

permissions:
  contents: read

jobs:
  firestore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whocaller-android/backend/tools
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set - nothing to do."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: whocaller-android/backend/tools/package-lock.json

      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund

      - name: Test
        if: steps.creds.outputs.ok == 'true'
        run: npm test

      - name: Upload sample callers
        if: steps.creds.outputs.ok == 'true' && github.event.inputs.task == 'seed-sample'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run seed -- data/sample-callers.csv --region IN

      - name: Aggregate reports
        if: steps.creds.outputs.ok == 'true' && (github.event_name == 'schedule' || github.event.inputs.task == 'aggregate')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run aggregate
