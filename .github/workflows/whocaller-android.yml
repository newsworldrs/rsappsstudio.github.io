name: WhoCaller Android build

on:
  push:
    paths:
      - "whocaller-android/**"
      - ".github/workflows/whocaller-android.yml"
  pull_request:
    paths:
      - "whocaller-android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whocaller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: whocaller-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that no secrets are committed
        run: |
          set -e
          ! git ls-files | grep -E '(^|/)(google-services\.json|keystore\.properties|local\.properties|\.env)$|\.(jks|keystore|p12|pem)$'
          ! git grep -nE 'AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|"private_key_id"' -- . ':!*.md'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon --continue testDebugUnitTest :core:model:test :core:common:test :core:domain:test :core:network:test

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build release APK (R8, unsigned unless signing is configured)
        run: ./gradlew --no-daemon assembleRelease

      - name: Compile instrumented tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whocaller-reports
          path: |
            whocaller-android/**/build/reports/**
            whocaller-android/**/build/test-results/**
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: whocaller-apks
          path: |
            whocaller-android/app/build/outputs/apk/debug/*.apk
            whocaller-android/app/build/outputs/apk/release/*.apk
          retention-days: 14
