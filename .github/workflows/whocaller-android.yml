name: WhoCaller Android build

on:
  push:
    paths:
      - "whocaller-android/**"
      - ".github/workflows/whocaller-android.yml"
  pull_request:
    paths:
      - "whocaller-android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whocaller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: whocaller-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that no secrets are committed
        run: |
          set -e
          ! git ls-files | grep -vE '^app/(debug\.keystore|google-services\.json)$' | grep -E '(^|/)(google-services\.json|keystore\.properties|local\.properties|\.env)$|\.(jks|keystore|p12|pem)$'
          ! git grep -nE 'AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|"private_key_id"' -- . ':!*.md' ':!app/google-services.json'

      - name: Override Firebase config from repository secret (if set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # Accept the raw JSON or a base64-encoded copy.
            if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Firebase config added."
          else
            echo "No GOOGLE_SERVICES_JSON secret: using the committed test app/google-services.json."
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon --continue testDebugUnitTest :core:model:test :core:common:test :core:domain:test :core:network:test

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build release APK (R8, unsigned unless signing is configured)
        run: ./gradlew --no-daemon assembleRelease

      - name: Compile instrumented tests
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whocaller-reports
          path: |
            whocaller-android/**/build/reports/**
            whocaller-android/**/build/test-results/**
            whocaller-android/core/database/schemas/**
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: whocaller-apks
          path: |
            whocaller-android/app/build/outputs/apk/debug/*.apk
            whocaller-android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish test APK as a GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WhoCaller-debug.apk
          gh release delete whocaller-latest --yes --cleanup-tag || true
          gh release create whocaller-latest WhoCaller-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "WhoCaller (latest test build)" \
            --notes "Test build from ${GITHUB_SHA::7} (package com.rskusum.whocaller, signed with the shared test key). Uses the built-in development backend: only fictional demo numbers such as +1 202-555-0142 return data."
